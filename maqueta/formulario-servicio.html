<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario servicio</title>
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/panel-usuario.css">
    <link rel="stylesheet" href="css/formulario-servicio.css">
</head>
<body>
    <header class="header">
        <nav class="navbar navbar-expand-lg navbar-light">
            <div class="container-fluid">
                <a class="navbar-brand header-logo" href="index.html">
                    <img src="imagenes/logo-rejunte.webp" alt="El Rejunte Hotel" loading="lazy">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="menuPrincipal">
                    <ul class="navbar-nav align-items-center gap-lg-4">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="quienes-somos.html">Nosotros</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Servicios</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="resultados-busqueda.html">Reservas</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="perfil-nav-link activo dropdown-toggle d-flex align-items-center gap-2" href="#" id="navbarDropdownUsuario" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <img src="imagenes/juan-perez.webp" alt="Juan Perez" class="perfil-nav-avatar">
                                Juan Perez
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdownUsuario">
                                <li>
                                    <a class="dropdown-item" href="panel-usuario.html">Perfil</a>
                                </li>
                                <li>
                                    <a class="dropdown-item" href="historial-reservas.html">Historial de reservas</a>
                                </li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <a class="dropdown-item text-danger" href="inicio-sesion.html">Salir</a>
                                </li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="contenedor-formulario py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
                    <div class="card tarjeta-formulario border-0 p-4 p-md-5">
                        <form>
                            <div class="text-center mb-4">
                                <h1 class="titulo-formulario mb-2">Complete los datos</h1>
                                <p class="text-muted mb-3">Reservá tu servicio en pocos pasos</p>
                                <span class="distintivo-servicio">Servicio seleccionado - Comedor</span>
                                <span class="distintivo-precio">Precio - $3500</span>
                            </div>
 
                            <div class="row g-3 mb-3">
                                <div class="col-sm-6">
                                    <label for="fecha" class="form-label etiqueta-formulario">Fecha</label>
                                    <input type="date" class="form-control campo-formulario" id="fecha" name="fecha" required>
                                </div>
                                <div class="col-sm-6">
                                    <label for="hora" class="form-label etiqueta-formulario">Hora</label>
                                    <input type="time" class="form-control campo-formulario" id="hora" name="hora" required>
                                </div>
                            </div>
 
                            <div class="mb-3">
                                <label for="cantidad-personas" class="form-label etiqueta-formulario">Cantidad de personas</label>
                                <input type="number" min="1" class="form-control campo-formulario" id="cantidad-personas" name="cantidad-personas" placeholder="Ej: 4" required>
                            </div>
 
                            <hr class="my-4">
 
                            <h2 class="h5 subtitulo-formulario mb-3">Datos de contacto</h2>
 
                            <div class="mb-3">
                                <label for="nombre-apellido" class="form-label etiqueta-formulario">Nombre completo</label>
                                <input type="text" class="form-control campo-formulario" id="nombre-apellido" name="nombre-apellido" placeholder="Ingresá tu nombre y apellido" required>
                            </div>
 
                            <div class="mb-3">
                                <label for="email" class="form-label etiqueta-formulario">Correo electrónico</label>
                                <input type="email" class="form-control campo-formulario" id="email" name="email" placeholder="Ingresá tu correo" required>
                            </div>
 
                            <div class="mb-4">
                                <label for="informacion-adicional" class="form-label etiqueta-formulario">Información adicional</label>
                                <textarea class="form-control campo-formulario" id="informacion-adicional" name="informacion-adicional" rows="3" placeholder="Alergias, pedidos especiales, aclaraciones..."></textarea>
                            </div>
 
                            <button type="submit" class="btn boton-formulario w-100">Completar reserva</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="bootstrap/bootstrap.bundle.js"></script>
</body>
</html>
