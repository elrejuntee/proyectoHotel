<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro - El Rejunte Hotel</title>
    <meta name="description" content="Registro de usuarios para la  pagina web El rejunte hotel">
    <link rel="stylesheet" href="/bootstrap/bootstrap.min.css">
</head>

<body>
    <header>
        <div>
            <a href="index.html">
                <img src="imagenes/logo-rejunte.webp" alt="logo hotel">
            </a>
        </div>
    </header>

    <main>
        <section>
            <form action="">
                <h1>Bienvenido a El Rejunte Hotel</h1>

                <div>
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" placeholder="Ingrese el nombre" required>

                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" placeholder="Ingrese el apellido" required>

                    <label for="email">email</label>
                    <input type="email" id="email" placeholder="Ingrese el email" required>

                    <label for="contraseña">Contraseña</label>
                    <input type="contraseña" id="contraseña" placeholder="Ingrese el contraseña" required>
                </div>

                <div>
                    <button type="submit">Registrarme</button>
                </div>

            </form>
        </section>
    </main>

    <link rel="stylesheet" href="/bootstrap/bootstrap.bundle.min.js">
</body>

</html>
