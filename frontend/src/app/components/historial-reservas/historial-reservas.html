<main class="panel">
    <div class="panel-inner">
        <section class="seccion-panel">
            <div class="seccion-panel-header">
                <h2 class="seccion-panel-titulo mb-4">Historial de reservas</h2>  
            </div>

            <!-- TABS -->
            <ul class="nav nav-tabs mb-4" id="historialTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active text-dark fw-semibold border-bottom-0" id="hab-tab" data-bs-toggle="tab" data-bs-target="#hab" type="button" role="tab" aria-controls="hab" aria-selected="true">
                        Habitaciones
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link text-dark fw-semibold border-bottom-0" id="serv-tab" data-bs-toggle="tab" data-bs-target="#serv" type="button" role="tab" aria-controls="serv" aria-selected="false">
                        Servicios
                    </button>
                </li>
            </ul>

            <!-- CONTENIDO TABS -->
            <div class="tab-content" id="historialTabsContent">
                
                <!-- PESTAÑA: HABITACIONES -->
                <div class="tab-pane fade show active" id="hab" role="tabpanel" aria-labelledby="hab-tab">
                    <div class="habitaciones-lista">
                        <div class="hab-item">
                            <div class="row">
                                <div class="col-auto d-flex">
                                    <img src="imagenes/deluxe.webp" alt="Deluxe Vista al Mar" class="hab-item-img">
                                </div>
                                <div class="col">
                                    <div class="hab-item-header">
                                        <span class="hab-item-nombre">Deluxe Vista al Mar</span>
                                        <span class="etiqueta etiqueta-deluxe">Deluxe</span>
                                    </div>
                                    <div class="hab-item-detalles">
                                        <span>1 cama king</span>
                                        <span>2 huéspedes</span>
                                    </div>
                                    <div class="mt-2">
                                        <span class="hab-item-fecha d-block">Check-in: 15/01/26</span>
                                        <span class="hab-item-fecha d-block">Check-out 18/01/26</span>
                                    </div>
                                    <span class="hab-item-precio d-block mt-1">Importe total: $280</span>
                                    <div class="d-flex justify-content-end mt-2">
                                        <a routerLink="/detalle-habitacion" class="btn btn-primario">Ver habitación</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- PESTAÑA: SERVICIOS -->
                <div class="tab-pane fade" id="serv" role="tabpanel" aria-labelledby="serv-tab">
                    <div class="habitaciones-lista">
                        <div class="hab-item">
                            <div class="row">
                                <div class="col-auto d-flex">
                                    <img src="imagenes/ejecutiva.webp" alt="Sala de Conferencia" class="hab-item-img">
                                </div>
                                <div class="col">
                                    <div class="hab-item-header">
                                        <span class="hab-item-nombre">Sala de Conferencia</span>
                                        <span class="etiqueta etiqueta-estandar">Servicio</span>
                                    </div>
                                    <div class="hab-item-detalles">
                                        <span>Capacidad hasta 50 personas</span>
                                    </div>
                                    <div class="mt-2">
                                        <span class="hab-item-fecha d-block">Fecha: 17/01/26</span>
                                        <span class="hab-item-fecha d-block">Duración: 4 horas</span>
                                    </div>
                                    <span class="hab-item-precio d-block mt-1">Importe total: $45.000</span>
                                    <div class="d-flex justify-content-end mt-2">
                                        <a routerLink="/servicios" class="btn btn-primario">Ver servicio</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </div>
</main>
