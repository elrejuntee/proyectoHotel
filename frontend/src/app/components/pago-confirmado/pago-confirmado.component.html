<main class="confirmacion-main">
    <div class="confirmacion-inner">
        <section class="confirmacion-encabezado confirmacion-animar">
            <div class="confirmacion-icono-wrap">
                <span class="confirmacion-icono-anillo"></span>
                <span class="confirmacion-icono-anillo confirmacion-icono-anillo--2"></span>
                <span class="confirmacion-icono">
                    <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </span>
            </div>
            <h1 class="confirmacion-titulo">¡Pago realizado con éxito!</h1>
            <p class="confirmacion-subtitulo">
                Gracias por elegir Hotel El Rejunte. Tu reserva fue confirmada correctamente.
            </p>
        </section>

        <section class="confirmacion-acciones confirmacion-animar">
            <a routerLink="/historial-reservas" class="btn btn-primario btn-grande">Ver mi reserva</a>
            <a routerLink="/" class="btn btn-secundario btn-grande">Volver al inicio</a>
        </section>
    </div>
</main>
