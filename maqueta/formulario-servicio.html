<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario servicio</title>
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css">
</head>
<body>
    <form>
        <h1>Complete los datos del servicio</h1>
        <div>
            <h2>Servicio seleccionado - Comedor 
                <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-fork-knife" viewBox="0 0 16 16">
                <path d="M13 .5c0-.276-.226-.506-.498-.465-1.703.257-2.94 2.012-3 8.462a.5.5 0 0 0 .498.5c.56.01 1 .13 1 1.003v5.5a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5zM4.25 0a.25.25 0 0 1 .25.25v5.122a.128.128 0 0 0 .256.006l.233-5.14A.25.25 0 0 1 5.24 0h.522a.25.25 0 0 1 .25.238l.233 5.14a.128.128 0 0 0 .256-.006V.25A.25.25 0 0 1 6.75 0h.29a.5.5 0 0 1 .498.458l.423 5.07a1.69 1.69 0 0 1-1.059 1.711l-.053.022a.92.92 0 0 0-.58.884L6.47 15a.971.971 0 1 1-1.942 0l.202-6.855a.92.92 0 0 0-.58-.884l-.053-.022a1.69 1.69 0 0 1-1.059-1.712L3.462.458A.5.5 0 0 1 3.96 0z"/>
                </svg>
            </h2>
        </div>
        <div>
            <label for="fecha">Fecha</label>
            <input type="date" id="fecha">

            <label for="hora">Hora</label>
            <input type="time" id="hora">
        </div>
        <div>
            <label for="cantidad-personas">Cantidad de personas</label>
            <input type="number" id="cantidad-personas">
        </div>
        <h3>Datos de contacto</h3>
        <div>
            <label for="nombre-apellido">Nombre completo</label>
            <input type="text" id="nombre-apellido">
        </div>
        <div>
            <label for="email">Correo electrónico</label>
            <input type="email" id="email">
        </div>
        <div>
            <label for="informacion-adicional">Información adicional</label>
            <textarea  id="informacion-adicional">
        </div>
        <button type="submit">Completar reserva</button>
    </form>
    
    <script src="bootstrap/bootstrap.bundle.js"></script>
</body>
</html>
