<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card text-center shadow-lg p-4" style="max-width: 700px; border-radius: 1.5rem;">
    <div class="card-body">
      
      <div class="mb-4">
        <img 
          src="/imagenes/p-404.webp"
          alt="Ilustración de error 404" 
          class="img-fluid d-block mx-auto" 
          style="max-height: 400px;">
      </div>
      
      <h3 class="fw-bold text-dark mb-1">ERROR</h3>
      
      <p class="text-secondary fw-semibold mb-3">Página no encontrada</p>
      
      <p class="text-secondary fw-semibold mb-3">
        ¡Ups! Parece que la página que buscas no existe.</p>
      
      <a [routerLink]="['/']" class="btn btn-primary d-block mx-auto w-50">
          <i class="bi bi-house-door-fill me-2"></i> Volver al inicio
      </a>
    </div>
  </div>
</div>
